<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator UI</title>
</head>
<body>
   
    <style>
        :root {
            --bg-color: #141414;
            --calc-bg: #1c1c1e;
            --display-color: #ffffff;
            --btn-number: #3a3a3c;
            --btn-text-light: #ffffff;
            --btn-utility: #a5a5a5;
            --btn-utility-text: #000000;
            --btn-operator: #ff9f0a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calculator {
            background-color: var(--calc-bg);
            width: 100%;
            max-width: 375px;
            padding: 24px;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .display {
            width: 100%;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 10px;
            word-wrap: break-word;
            word-break: break-all;
        }

        .previous-operand {
            color: rgba(255, 255, 255, 0.4);
            font-size: 1.2rem;
            margin-bottom: 8px;
        }

        .current-operand {
            color: var(--display-color);
            font-size: 3.5rem;
            font-weight: 300;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-top: 20px;
        }

        button {
            border: none;
            outline: none;
            height: 72px;
            width: 72px;
            border-radius: 50%;
            font-size: 1.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: filter 0.1s ease, transform 0.1s ease;
            user-select: none;
        }

        button:active {
            filter: brightness(1.3);
            transform: scale(0.95);
        }

        /* Number button styling */
        .number {
            background-color: var(--btn-number);
            color: var(--btn-text-light);
        }

        /* Top row utility button styling */
        .utility {
            background-color: var(--btn-utility);
            color: var(--btn-utility-text);
            font-size: 1.6rem;
        }

        /* Right column operator button styling */
        .operator {
            background-color: var(--btn-operator);
            color: var(--btn-text-light);
            font-size: 2rem;
        }

        /* Double width for the 0 key */
        .zero {
            grid-column: span 2;
            width: 100%;
            border-radius: 40px;
            padding-left: 28px;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <div class="display">
            <div id="previous" class="previous-operand"></div>
            <div id="current" class="current-operand"></div>
        </div>
        <div class="buttons-grid">
            <button class="utility" onclick="clearDisplay()">AC</button>
            <button class="utility" onclick="toggleSign()">±</button>
            <button class="utility" onclick="addToDisplayy('%')">%</button>
            <button class="operator" onclick="addToDisplayy('/')">/</button>

            <button class="number" onclick="addToDisplayy(7)">7</button>
            <button class="number" onclick="addToDisplayy(8)">8</button>
            <button class="number" onclick="addToDisplayy(9)">9</button>
            <button class="operator" onclick="addToDisplayy('*')">*</button>

            <button class="number" onclick="addToDisplayy(4)">4</button>
            <button class="number" onclick="addToDisplayy(5)">5</button>
            <button class="number" onclick="addToDisplayy(6)">6</button>
            <button class="operator" onclick="addToDisplayy('-')">-</button>

            <button class="number" onclick="addToDisplayy(1)">1</button>
            <button class="number" onclick="addToDisplayy(2)">2</button>
            <button class="number" onclick="addToDisplayy(3)">3</button>
            <button class="operator" onclick="addToDisplayy('+')">+</button>

            <button class="number zero" onclick="addToDisplayy(0)">0</button>
            <button class="number" onclick="addToDisplayy('.')">.</button>
            <button class="operator" onclick="calculate()">=</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
